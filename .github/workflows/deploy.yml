name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The gate the old site never had: it deployed anything that compiled.
      - name: Typecheck
        run: npm run check

      # `npm run build` also asserts og.png, the favicon, robots.txt and the
      # sitemap exist in dist/. The old site shipped a broken og:image for
      # months because nothing ever checked a URL only scrapers fetch.
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: ./dist

  deploy:
    # Pull requests build and typecheck but never deploy.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
